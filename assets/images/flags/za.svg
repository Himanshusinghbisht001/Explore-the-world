<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Red top, Blue bottom -->
  <rect width="900" height="300" fill="#E03C31"/>
  <rect y="300" width="900" height="300" fill="#001489"/>
  <!-- White border for green pall -->
  <path d="M0,0 L400,300 L900,300 L900,300 L400,300 L0,600 Z" fill="#FFFFFF"/>
  <rect y="200" width="900" height="200" fill="#FFFFFF"/>
  <!-- Green pall -->
  <path d="M0,35 L350,300 L900,300 L900,300 L350,300 L0,565 Z" fill="#007749"/>
  <rect y="235" width="900" height="130" fill="#007749"/>
  <!-- Yellow border for black triangle -->
  <polygon points="0,75 300,300 0,525" fill="#FFB81C"/>
  <!-- Black triangle -->
  <polygon points="0,120 240,300 0,480" fill="#000000"/>
</svg>
