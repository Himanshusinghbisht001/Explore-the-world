<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <rect width="900" height="200" fill="#FF9933"/>
  <rect y="200" width="900" height="200" fill="#FFFFFF"/>
  <rect y="400" width="900" height="200" fill="#138808"/>
  <g transform="translate(450, 300)" stroke="#000080" fill="none">
    <circle r="78" stroke-width="6"/>
    <circle r="16" fill="#000080"/>
    <!-- 24 spokes -->
    <g stroke-width="2.5">
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(0)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(15)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(30)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(45)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(60)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(75)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(90)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(105)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(120)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(135)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(150)"/>
      <line x1="0" y1="-78" x2="0" y2="78" transform="rotate(165)"/>
    </g>
  </g>
</svg>
